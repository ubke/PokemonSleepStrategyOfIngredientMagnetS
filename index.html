<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokemonSleepCooking for 食材ゲットS運用</title>
    <style>
        /* 基本設定 */
        body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 0; background-color: #ffffff; color: #333; }
        
        /* ヘッダー */
        header { background-color: #B0C4DE; padding: 15px 20px; display: flex; justify-content: center; align-items: center; border-bottom: 2px solid #90a4be; }
        .header-title-area { display: flex; align-items: center; }
        .header-icon-img { width: 40px; height: 40px; margin-right: 15px; border-radius: 8px; object-fit: cover; }
        h1 { font-size: 1.4rem; margin: 0; color: #000; line-height: 1.2; text-align: left; }

        /* メイン */
        main { padding: 0; }
        
        /* エリア共通 */
        section { padding: 15px 20px; border-bottom: 1px solid #eee; }
        .area-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .area-title { font-weight: bold; font-size: 1.1rem; }

        /* 食材選択エリア */
        #ingredient-selection-area { background-color: #FFFACD; border-bottom: 2px solid #e0dbb0; }
        details { cursor: pointer; transition: all 0.2s; }
        details[open] { padding-bottom: 10px; }
        summary { font-weight: bold; font-size: 1.1rem; outline: none; list-style: none; display: flex; align-items: center; color: #555; margin-bottom: 10px;}
        summary::after { content: "▼"; font-size: 0.8rem; margin-left: 10px; transition: transform 0.2s; }
        details[open] summary::after { transform: rotate(180deg); }
        summary::-webkit-details-marker { display: none; }

        /* 料理カテゴリ選択エリア */
        #category-selection-area { background-color: #e0f7fa; border-bottom: 2px solid #b2ebf2; }

        /* エナジーフィルター（新設） */
        .energy-filter-area { margin-top: 15px; border-top: 1px dashed #aaa; padding-top: 12px; font-weight: bold; color: #444; }
        .energy-input { width: 80px; padding: 6px; border-radius: 4px; border: 1px solid #888; font-size: 1rem; text-align: right; margin-right: 5px; margin-left: 5px; }

        /* ボタン群のコンテナ */
        .ingredient-group, .category-group { display: flex; flex-wrap: wrap; gap: 10px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* 操作ボタン（全選択など） */
        .action-btn {
            font-size: 0.8rem; padding: 4px 12px; border-radius: 4px; border: 1px solid #999; 
            background: #f0f0f0; cursor: pointer; user-select: none; margin-bottom: 10px; display: inline-block;
        }
        .action-btn:hover { background-color: #e0e0e0; }
        .action-btn:active { background-color: #ccc; }
        .action-btn.selected { background-color: #4CAF50; color: white; border-color: #2E7D32; }

        /* 食材・カテゴリチップ */
        .chip { font-size: 0.9rem; padding: 8px 16px; border-radius: 24px; border: 2px solid #555; background: #fff; cursor: pointer; user-select: none; transition: all 0.1s; font-weight: bold; }
        .chip:hover { background-color: #f0f0f0; }
        .chip.selected { background-color: #4CAF50; border-color: #2E7D32; color: white; }

        /* カテゴリごとの色分け（選択時） */
        .chip.cat-Curry.selected { background-color: #ff7043; border-color: #d84315; }
        .chip.cat-Salad.selected { background-color: #66bb6a; border-color: #2e7d32; }
        .chip.cat-Dessert.selected { background-color: #fdd835; border-color: #f9a825; color: #333; }

        /* 検索結果エリア */
        #search-result-area { background-color: #ffffff; min-height: 300px; }
        .recipe-list { display: flex; flex-direction: column; gap: 12px; }

        /* レシピカード */
        .recipe-card { background: #fff; border: 2px solid #eee; border-radius: 12px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left-width: 8px; }
        .recipe-header { display: flex; align-items: center; margin-bottom: 8px; gap: 10px; }
        .recipe-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; border: 1px solid #eee; background-color: #f0f0f0; flex-shrink: 0; }
        .recipe-title-group { flex-grow: 1; }
        .recipe-name { font-weight: bold; font-size: 1.1rem; line-height: 1.3; }
        .energy-val { color: #f57c00; font-weight: bold; white-space: nowrap; }

        .recipe-card.disabled { background-color: #f9f9f9; border-color: #ddd; }
        .recipe-card:not(.disabled) { border: 2px solid #4CAF50; background-color: #fff; box-shadow: 0 4px 8px rgba(76, 175, 80, 0.2); }

        .ing-row { font-size: 0.9rem; color: #555; background-color: rgba(255,255,255,0.5); padding: 10px; border-radius: 8px; line-height: 1.6; }
        .ing-ok { color: #333; font-weight: bold; }
        .ing-missing { color: #aaa; }
        
        /* カテゴリ色 */
        .type-Curry { border-left-color: #ffab91; } .bg-Curry { background-color: #ff7043; color:white; padding:2px 6px; border-radius:4px; font-size:0.7rem; margin-right:5px;}
        .type-Salad { border-left-color: #a5d6a7; } .bg-Salad { background-color: #66bb6a; color:white; padding:2px 6px; border-radius:4px; font-size:0.7rem; margin-right:5px;}
        .type-Dessert { border-left-color: #fff59d; } .bg-Dessert { background-color: #fdd835; color:#444; padding:2px 6px; border-radius:4px; font-size:0.7rem; margin-right:5px;}

        @media (max-width: 600px) { header { justify-content: flex-start; } }
    </style>
</head>
<body>
    <header>
        <div class="header-title-area">
            <img src="icon.jpg" alt="アプリアイコン" class="header-icon-img">
            <h1>PokemonSleepCooking<br>for 食材ゲットS運用</h1>
        </div>
    </header>

    <main>
        <section id="ingredient-selection-area">
            <details>
                <summary>食材を選ぶ（タップで開く）</summary>
                
                <div id="btn-all-ingredients" class="action-btn">全選択 ON/OFF</div>
                
                <div id="ingredient-container" class="ingredient-group">
                    </div>
            </details>
        </section>

        <section id="category-selection-area">
            <div class="area-header">
                <div class="area-title">料理の種類を選ぶ</div>
            </div>
            
            <div id="btn-all-categories" class="action-btn">全選択 ON/OFF</div>

            <div id="category-container" class="category-group">
                </div>

            <div class="energy-filter-area">
                <label>
                    ⚡ エナジー
                    <input type="number" id="energy-threshold" class="energy-input" placeholder="0" min="0">
                    以下の料理は除外
                </label>
            </div>
        </section>

        <section id="search-result-area">
            <div class="area-title" style="margin-bottom:10px;">▼検索結果（作れる料理：<span id="count">0</span>件）</div>
            <div id="recipe-container" class="recipe-list">
                <div style="color:#999; padding:20px; text-align:center;">ここに結果が表示されます</div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
