<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokemonSleepCooking for 食材ゲットS運用</title>
    <style>
        /* 基本設定 */
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333;
        }
        
        /* --- ヘッダー領域 (青色) --- */
        header {
            background-color: #B0C4DE;
            padding: 15px 20px;
            display: flex;
            justify-content: center; /* 中央寄せ */
            align-items: center;
            border-bottom: 2px solid #90a4be;
        }
        .header-title-area {
            display: flex;
            align-items: center;
        }
        /* アプリアイコン画像の設定 */
        .header-icon-img {
            width: 40px;
            height: 40px;
            margin-right: 15px;
            border-radius: 8px;
            object-fit: cover;
        }
        h1 {
            font-size: 1.4rem;
            margin: 0;
            color: #000;
            line-height: 1.2;
            text-align: left;
        }

        /* --- メインコンテンツ --- */
        main {
            padding: 0;
        }

        /* エリア共通タイトルスタイル */
        .area-title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* --- 食材選択エリア (黄色・プルダウン仕様) --- */
        #ingredient-selection-area {
            background-color: #FFFACD;
            border-bottom: 2px solid #e0dbb0;
        }
        
        /* 開閉の仕組み */
        details {
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        details[open] {
            padding-bottom: 20px;
        }
        summary {
            font-weight: bold;
            font-size: 1.1rem;
            outline: none;
            list-style: none;
            display: flex;
            align-items: center;
            color: #555;
        }
        summary::after {
            content: "▼";
            font-size: 0.8rem;
            margin-left: 10px;
            transition: transform 0.2s;
        }
        details[open] summary::after {
            transform: rotate(180deg);
        }
        summary::-webkit-details-marker {
            display: none;
        }

        .ingredient-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding-top: 15px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 食材ボタン（チップ） */
        .chip {
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 24px;
            border: 2px solid #555;
            background: #fff;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s;
            font-weight: bold;
        }
        .chip:hover {
            background-color: #f0f0f0;
        }
        .chip.selected {
            background-color: #4CAF50;
            border-color: #2E7D32;
            color: white;
        }

        /* --- 検索結果エリア (白色) --- */
        #search-result-area {
            padding: 15px 20px;
            background-color: #ffffff;
            min-height: 300px;
        }
        .recipe-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- レシピカードのスタイル（画像対応版） --- */
        .recipe-card {
            background: #fff;
            border: 2px solid #eee;
